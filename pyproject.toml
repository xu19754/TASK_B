[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atec-taskb-student"
version = "0.1.2"
description = "Task B student assignment: B2+Z1 perception, grasping and delivery"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "trimesh", "gymnasium", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4.9"]

[tool.setuptools]
packages = ["taskb_student", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
